spring.application.name=freelancelk-backend


spring.datasource.url=jdbc:postgresql://localhost:5432/freelancelk
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# none = use your manual schema.sql, dont let Hibernate auto-generate tables
spring.jpa.hibernate.ddl-auto=none
# Run schema.sql on startup to create tables if they don't exist
spring.sql.init.mode=always
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

