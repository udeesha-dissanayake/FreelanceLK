# ================================================================
# FILE UPLOADS ? Multipart
# Raised limits: 5MB for images, 10MB for identity documents
# app.upload.dir = where files land on disk (relative to where you run the jar)
# For production, set this to an absolute path e.g. /var/freelancelk/uploads
# ================================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=uploads