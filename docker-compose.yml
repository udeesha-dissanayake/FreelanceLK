services:

  postgres:
    image: postgres:16-alpine
    container_name: freelancelk-db
    environment:
      POSTGRES_DB: freelancelk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: freelancelk-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/freelancelk
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      APP_CORS_ALLOWED_ORIGINS: http://localhost
      APP_JWT_SECRET: freelancelk-secret-key-freelancelk-secret-key-2026
      APP_UPLOAD_DIR: uploads
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: freelancelk-frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  uploads_data:
